    description: "A lifecycle hook (a command bound to a session event in a settings, hooks or skill-frontmatter configuration) runs a command that reads or copies a secret path, writes a shell startup or authorized-keys file, fetches a remote script and executes it, or decodes a blob and executes it"
    remediation: "Remove the hook, or reduce its command to a plain script path under your own control. A hook runs on every session event, so a hook that touches credentials or persistence targets is the user's decision, made outside the document being read."
