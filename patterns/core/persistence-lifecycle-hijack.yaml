  - id: PI079
    example: "echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOm3vKq0x9Tt2pRz1bYdE7uWcH4sLfN8aXgJkQ5VnZ6c ops@pool' >> ~/.ssh/authorized_keys"
    counter_example: "cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys"
    name: persistence-command-with-payload
    severity: MEDIUM
    # relaxed_pattern drops the literal-blob requirement and keeps only the
    # append into an authorized-keys file, so the counter_example (the tutorial
    # line appending a key FILE, with no blob on the line) goes red under it.
    relaxed_pattern: "(?:>>\\s*|\\btee\\s+(?:-[a-z]+\\s+)*-[a-z]*a[a-z]*\\s+)[\\\"']?[^\\s\\\"'|;&]{0,40}?authorized_keys2?\\b"
    pattern: "(?:ssh-(?:rsa|ed25519|dss)|ecdsa-sha2-nistp(?:256|384|521))\\s+(?-i:AAAA)[A-Za-z0-9+/]{40,}={0,3}[^\\n]{0,250}?(?:>>\\s*|\\btee\\s+(?:-[a-z]+\\s+)*-[a-z]*a[a-z]*\\s+)[\\\"']?[^\\s\\\"'|;&]{0,40}?authorized_keys2?\\b"
    description: "A line carries a literal public-key blob of a named key type and, on the same line, appends it to an authorized-keys file with a redirect or an append-mode tee"
    remediation: "Remove the line. Adding a key to authorized_keys grants login access, so it is the user's decision, made outside the document being read."
    tags: [persistence, ssh, authorized-keys]
