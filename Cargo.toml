[package]
name = "injection-scanner"
version = "0.0.3"
edition = "2021"
description = "Prompt injection static scanner for AI spec files, skills, and RAG documents"
license = "MIT"
repository = "https://github.com/UnityInFlow/injection-scanner"
authors = ["Jiri Hermann"]
keywords = ["prompt-injection", "security", "ai", "scanner", "claude"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
anyhow = "1"
thiserror = "2"
ignore = "0.4.33"
unicode-normalization = "0.1.25"
unicode-security = "0.1.2"

[dev-dependencies]
# Benchmarks only (`benches/scan.rs`). The CI-enforced perf guard is a plain
# integration test — see tests/perf_regression_test.rs — so nothing in the test
# gate depends on this.
criterion = "0.8"

[[bench]]
name = "scan"
harness = false
