[package]
name = "injection-scanner"
version = "0.1.0"
edition = "2021"
description = "Prompt injection static scanner for AI spec files, skills, and RAG documents"
license = "MIT"
repository = "https://github.com/UnityInFlow/injection-scanner"
authors = ["Jiri Hermann"]
keywords = ["prompt-injection", "security", "ai", "scanner", "claude"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
toml = "0.8"
regex = "1"
anyhow = "1"
thiserror = "2"
ignore = "0.4.33"
unicode-normalization = "0.1.25"
unicode-security = "0.1.2"
sha2 = "0.10"
# Multi-pattern literal prefiltering (`src/prefilter.rs`, issue #4). Neither is
# a new crate in the tree: `regex` already depends on both, and `ignore` pulls
# `aho-corasick` in through `globset`. Naming them directly only makes the
# existing edges explicit — `cargo tree -i aho-corasick` showed them before this
# change — so the binary gains no third-party code it was not already shipping.
aho-corasick = "1.1.5"
regex-syntax = "0.8.11"

[dev-dependencies]
# Benchmarks only (`benches/scan.rs`). The CI-enforced perf guard is a plain
# integration test — see tests/perf_regression_test.rs — so nothing in the test
# gate depends on this.
criterion = "0.8"

[[bench]]
name = "scan"
harness = false
