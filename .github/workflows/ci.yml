name: CI

# ── RUNNER POLICY — READ BEFORE EDITING ───────────────────────────────────────
# This job runs on a GITHUB-HOSTED runner. That is deliberate, and it is the one
# sanctioned exception to the org-wide "never use ubuntu-latest" rule.
#
# This repo is PUBLIC, and the UnityInFlow org runner group enforces
# `allows_public_repositories: false` — so NO self-hosted job can be scheduled
# here at all. On top of that, `arc-runner-unityinflow` currently matches zero
# registered runners. A previous version of this file matrixed over both labels;
# the result was two consecutive runs cancelled after a 24-hour queue timeout on
# 2026-06-24, leaving the repo with no test gate while it shipped v0.0.2.
#
# Do NOT "fix" this back to a self-hosted label. The job will queue until it is
# cancelled. See the August 2026 row in the root CLAUDE.md decisions log, and the
# identical D-02 split already in use by spec-ci-plugin.
#
# The trade this makes: no secret may ever be referenced by this workflow. It is
# reachable from fork pull requests, so it stays read-only and secretless.
#
# Release work lives in release.yml, behind a tag push that a fork cannot fire.
# That workflow is ALSO GitHub-hosted as of issue #45, for the same scheduling
# reason as this one -- under `allows_public_repositories: false` its jobs could
# not be scheduled here at all, so the pipeline was silently dead. It is safe
# there because it uses no org secret, only the built-in GITHUB_TOKEN, and the
# ephemeral runner additionally lets it emit a signed SLSA build-provenance
# attestation that a persistent self-hosted box could not.
# ──────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:

# Read-only. Never add write scopes or secrets to this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest
    # #188 caches embedded test scanners once per binary, reducing both test
    # runs (ordinary and coverage). Keep the 60-minute cold-build allowance
    # until a complete hosted coverage run measures the new end-to-end cost;
    # local warm test timings alone do not establish a safe CI ceiling.
    #
    # Do NOT "fix" a timeout by touching `runs-on` -- see the CI policy in
    # CLAUDE.md; a self-hosted label on this public repo queues forever.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The ACTION is SHA-pinned (supply chain); `toolchain: stable` keeps the
      # Rust version tracking latest stable, which is what we want to test against.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          # llvm-tools-preview is what cargo-llvm-cov needs for the coverage gate below.
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # --locked so a stale or hand-edited Cargo.lock fails here rather than
      # silently resolving to different dependency versions than the release.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: Sweep helper regression check
        run: bash tests/gate03_sweep_test.sh

      # TEST-02 (issue #29). The criterion benches in `benches/scan.rs` cover the
      # four shapes that matter — pattern-set compile, one large file, 500 small
      # files, and a pathological line — but nothing ran them, so they could rot
      # unnoticed until someone needed a measurement and found a broken harness.
      #
      # `--test` is criterion's own mode: it executes each benchmark exactly once
      # and asserts it completes, in seconds rather than minutes. Timing on a
      # shared hosted runner is too noisy to gate on, so the numeric regression
      # guards live where they can be trusted: the machine-independent ratio in
      # `tests/perf_regression_test.rs`, and the end-to-end budget below.
      - name: Benchmarks run
        run: cargo bench --locked -- --test

      # TEST-01 (issue #29). Both CLAUDE.md files require ">80% coverage on core
      # logic before any release", and until now nothing measured it.
      #
      # The threshold is 85%, not 80. Coverage measured 93.65% of lines when this
      # gate landed, so a bar at the documented 80% would permit a silent 13-point
      # slide before anyone noticed — a gate that only fires after the damage is
      # not a gate. 85% keeps ~8 points of headroom for ordinary churn while still
      # catching a real erosion. Raise it as coverage rises; never lower it to make
      # a red build green.
      #
      # Worth knowing: llvm-cov builds into `target/llvm-cov-target/`, which is
      # exactly how the stale-binary bug in #61 was found — 14 CLI tests passing
      # against a binary they never built. `tests/test_harness_contract_test.rs`
      # guards that now, and running coverage in CI re-exercises the guard under
      # the alternate target directory that exposed it.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      - name: Coverage gate — 85% of lines
        run: cargo llvm-cov --locked --summary-only --fail-under-lines 85

      - name: cargo build --release
        run: cargo build --release --locked

      # Smoke test: the binary must actually run and report its version. Catches
      # the class of breakage where everything compiles but the CLI panics on start.
      - name: Binary smoke test
        run: |
          ./target/release/injection-scanner --version
          ./target/release/injection-scanner check tests/fixtures/clean-skill.md

      # PERF-01: "<200ms for a typical project" (issue #29).
      #
      # `tests/perf_regression_test.rs` already defends the invariant that the
      # pattern set is compiled once, and does so as a machine-independent ratio.
      # This gate is the complement: it measures the *release binary end to end*,
      # including directory walking and file I/O, against the budget the README
      # actually claims. It is what would catch a regression outside the scanner
      # — in the walk, say — that the ratio test cannot see.
      #
      # Best of three runs, after a warm-up, so a descheduled sample cannot fail
      # the build. Measured at ~5ms of scan time locally and well under 100ms
      # end-to-end on a hosted runner; the regressed build this defends against
      # was 806ms on hardware faster than CI.
      - name: Performance gate — 500 files under 400ms
        run: |
          set -euo pipefail
          corpus="$(mktemp -d)"
          for i in $(seq 1 500); do
            printf '# Doc %s\n\nOrdinary prose about the project.\n\n- a bullet\n- another bullet\n' "$i" \
              > "$corpus/doc$i.md"
          done

          # This step depends on a `cargo build --release` earlier in the same
          # job. If the job is ever split so the build happens elsewhere, say so
          # instead of failing several lines later inside the timing loop, where
          # it would read as a performance problem rather than a missing binary.
          binary=./target/release/injection-scanner
          if [ ! -x "$binary" ]; then
            echo "::error::$binary is missing or not executable — the release build must run in this job before the performance gate."
            exit 1
          fi

          scan() { "$binary" check "$corpus" --format json > /dev/null; }

          scan  # warm the page cache; the first run pays for cold reads

          best=999999
          for _ in 1 2 3; do
            start=$(date +%s%N)
            scan
            elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
            if [ "$elapsed" -lt "$best" ]; then best=$elapsed; fi
          done

          # Budget raised 200 -> 400ms on 2026-10-20. The 200ms figure was set in
          # 20c88d1 (2026-08-21) against a 48-pattern library; v0.2.0 ships 79, a
          # 65% increase in per-file matching work, and the budget was never
          # revisited. It went unnoticed because the job was being cancelled at
          # 30 minutes before ever reaching this step — raising that ceiling to 60
          # exposed a gate that had already been failing.
          #
          # Measured: 213ms on a hosted runner (#188), and 172ms best-of-5 locally
          # on arm64 with individual runs spanning 172-375ms. At 200ms the gate was
          # nondeterministic rather than wrong: four Dependabot PRs on 2026-10-16
          # that changed no Rust at all split two-pass/two-fail (#193 #195 vs
          # #194 #196), and `main` itself was red from 2026-10-10.
          #
          # 400ms keeps the gate load-bearing. The regression it exists to catch is
          # pattern compilation moving back inside the per-file loop, which cost
          # 806ms at 48 patterns and would be ~1.3s at 79 — still several times over
          # this budget. Re-derive this number whenever the pattern count moves
          # materially; a budget that tracks no measurement is how this one rotted.
          echo "500-file scan: ${best}ms (budget 400ms)"
          if [ "$best" -ge 400 ]; then
            echo "::error::PERF-01 regression: 500 files took ${best}ms, budget is 400ms (issue #29)."
            exit 1
          fi
